name: MarineRadar Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://localhost:27017/marineradar_test
          JWT_SECRET: marineradar-ci-secret-2026
          GEMINI_API_KEY: mock_ci_key
