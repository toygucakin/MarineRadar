services:
  # MongoDB Servisi (Veritabanı)
  mongodb:
    image: mongo:latest
    container_name: marineradar-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=marineradar
    volumes:
      - mongo_data:/data/db

  # Express.js REST API Servisi (Canlı Kod Yeniden Yükleme / Hot-Reload Destekli)
  app:
    build: .
    container_name: marineradar-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/marineradar
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:4000,http://localhost:3000
      - SERVE_STATIC=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - mongodb

volumes:
  mongo_data:
